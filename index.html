<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spielblock">
<meta name="theme-color" content="#1c1c2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Spielblock</title>
<style>
:root{--bg:#1c1c2e;--card:#2a2a42;--card2:#35354f;--txt:#f2f2f7;--dim:#9b9bb4;--acc:#5b8cff;--ok:#30c86a;--bad:#ff5a5f;--gold:#ffc83d;--line:#3d3d5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--txt);-webkit-user-select:text;user-select:text}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;min-height:52px}
#top h1{flex:1;margin:0;font-size:20px;line-height:24px;text-align:center}
#top .side{width:84px;flex:none}
#back{color:var(--acc);font-size:17px;line-height:24px;text-align:left;width:84px;flex:none;padding:8px 0;white-space:nowrap}
#app{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:20px;margin-bottom:12px;font-size:20px;font-weight:600}
.big:active{background:var(--card2)}
.big .ic{font-size:34px}
.big small{display:block;font-size:14px;color:var(--dim);font-weight:400;margin-top:2px}
.big[disabled]{opacity:.4}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--card2);font-weight:600;font-size:17px;text-align:center}
.btn.ok{background:var(--ok);color:#06210f}
.btn.bad{background:var(--bad);color:#fff}
.btn.acc{background:var(--acc);color:#fff}
.btn[disabled]{opacity:.4}
.btn+.btn{margin-top:10px}
label.l{display:block;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 0;border-radius:12px;background:var(--card2);font-weight:600;font-size:17px}
.seg button.on{background:var(--acc)}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid transparent;background:var(--card2);font-size:17px;margin-bottom:8px;outline:0}
.inp:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card2);font-size:15px}
.chip.used{opacity:.35}
.chip.on{background:var(--acc)}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.sk .seg{flex-wrap:wrap}
.sk .seg button{min-width:40px}
.chart{position:relative;background:var(--card);border-radius:18px;padding:12px 8px 8px;margin-bottom:12px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{font-size:11px;fill:var(--dim);font-variant-numeric:tabular-nums}
.chart .lbl{font-size:12px;font-weight:700;fill:var(--txt)}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.4);display:none;min-width:130px}
.tip div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:4px 8px 10px;font-size:14px}
table.tab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.tab th,table.tab td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.tab th:first-child,table.tab td:first-child{text-align:left;color:var(--dim)}
.sheet{border-radius:16px;overflow:clip;background:var(--card);min-width:fit-content}
.wrap{border-radius:16px}
.row{display:grid;grid-template-columns:112px repeat(var(--n),minmax(68px,1fr));border-bottom:1px solid var(--line)}
.row>div,.row>button{padding:0 6px;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.row .lab{justify-content:flex-start;padding-left:12px;font-size:15px;position:sticky;left:0;background:var(--card);z-index:1}
.row.head .lab{z-index:4}
.row.head{position:sticky;top:-8px;z-index:3;background:var(--card2);font-weight:700}
.row.head>div{background:var(--card2);font-size:14px;word-break:break-word;min-height:44px}
.row.sec{background:var(--bg);color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.row.sec>div{min-height:28px;background:var(--bg);justify-content:flex-start;font-size:12px}
.row.sum{background:#30304a;font-weight:700}
.row.sum .lab{background:#30304a}
.row.total{background:#3a4a86;font-weight:800;font-size:19px}
.row.total .lab{background:#3a4a86}
.row.total>div{font-size:20px}
.cell{border-left:1px solid var(--line)}
button.cell:active{background:var(--card2)}
.cell.empty::after{content:"";width:26px;height:4px;border-radius:2px;background:var(--line)}
.cell.zero{color:var(--dim);text-decoration:line-through}
.hint{color:var(--dim);font-size:11px;display:block}
.lead{color:var(--gold)}
#modal,#win{position:fixed;inset:0;display:none;z-index:50}
#modal.on,#win.on{display:block}
#modal .bg,#win .bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#modal .box{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85dvh;overflow:auto}
.box h3{margin:0 0 4px;font-size:19px}
.box p{margin:0 0 14px;color:var(--dim);font-size:14px}
.grid{display:grid;gap:8px}
.grid button{padding:14px 0;border-radius:12px;background:var(--card2);font-size:18px;font-weight:600}
.grid button:active{background:var(--acc)}
.grid button.z{background:#4a3040}
#win .box{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);background:var(--card);border-radius:24px;padding:24px 20px;text-align:center;max-height:90dvh;overflow:auto}
#win .trophy{font-size:64px}
#win h2{margin:4px 0 2px;font-size:28px;color:var(--gold)}
.rank{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.rank:last-of-type{border:0}
canvas#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center}
.stat div{background:var(--card2);border-radius:12px;padding:8px 4px;font-size:20px;font-weight:700}
.stat span{display:block;font-size:11px;color:var(--dim);font-weight:400;text-transform:uppercase}
.name{font-size:19px;font-weight:700}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set input[type=number]{width:80px;padding:10px;border-radius:10px;border:0;background:var(--card2);text-align:center;font-size:17px}
.tog{width:52px;height:32px;border-radius:99px;background:var(--card2);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--ok)}
.tog.on::after{left:23px}
.muted{color:var(--dim);font-size:14px;text-align:center;margin:10px 0}
.hist{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.crow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.crow .nm{flex:1;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow input{width:74px;padding:12px 6px;border-radius:10px;border:2px solid transparent;background:var(--card2);text-align:center;font-size:18px;outline:0}
.crow input:focus{border-color:var(--acc)}
.crow button{width:44px;height:44px;border-radius:10px;background:var(--card2);font-size:18px;flex:none}
.crow button.on{background:var(--acc)}
.crow button.zero{opacity:.45}
.crow button.zero.on{background:var(--bad);opacity:1}
.tcard{text-align:center}
.tcard p{margin:0 0 14px;color:var(--dim);font-size:15px}
.tc{width:170px;aspect-ratio:5/7;margin:4px auto 14px;border-radius:16px;padding:7px;background:var(--c);box-shadow:0 10px 26px rgba(0,0,0,.45);color:#fff;animation:flip .45s ease-out}
.tc .in{position:relative;height:100%;border:2px solid rgba(255,255,255,.55);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.tc .co{position:absolute;font-size:13px;font-weight:800;letter-spacing:.04em}
.tc .co.a{top:6px;left:8px}.tc .co.b{bottom:6px;right:8px;transform:rotate(180deg)}
.tc .sym{font-size:58px;line-height:1}
.tc .val{font-size:40px;font-weight:900;line-height:1}
.tc .nm{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tc.back .in{background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px)}
.tc.back .nm{font-size:26px;letter-spacing:.12em}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg)}to{transform:perspective(600px) rotateY(0)}}
</style>
</head>
<body>
<div id="top"><button id="back">‹ Zurück</button><h1 id="title">Spielblock</h1><div class="side"></div></div>
<div id="app"></div>
<div id="modal"><div class="bg" data-act="closeModal"></div><div class="box" id="modalBox"></div></div>
<div id="win"><div class="bg"></div><div class="box" id="winBox"></div></div>
<canvas id="conf"></canvas>

<script>
'use strict';
/* ---------- Helfer & Speicher ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'spielblock.v1';
let DB = (() => { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return d; } catch (e) {} return {sound: true, games: {}}; })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} };
const G = k => DB.games[k] || (DB.games[k] = {current: null, history: [], settings: {}});

/* ---------- Kniffel-Logik ---------- */
const KDEF = {bonusThr: 63, bonusVal: 35, fh: 25, ks: 30, gs: 40, kn: 50, kb: false, kbVal: 100};
const kset = () => ({...KDEF, ...G('kniffel').settings});
const TDEF = {target: 6000, deck: 'real'};
const CDEF = {limit: 100, reset: true, kami: true, joker: true};
const ZERO = {kami: '💥', joker: '🃏'};
const cset = () => ({...CDEF, ...G('cabo').settings});
const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500'];
const SDEF = {sau: 10, solo: 50, ramsch: 10, durch: 50, extra: 10, lfSau: 3, lfSolo: 3, lfWenz: 2, ramschOn: true, kontra: true};
const sset = () => ({...SDEF, ...G('schafkopf').settings});
const SKT = {sau: 'Sauspiel', solo: 'Solo', wenz: 'Wenz', ramsch: 'Ramsch'};
const eur = (c, sign) => (sign && c > 0 ? '+' : '') + (c / 100).toFixed(2).replace('.', ',') + ' €';
const DEFS = {kniffel: KDEF, tutto: TDEF, cabo: CDEF, schafkopf: SDEF};
const TCARDS = {
  b200: {sym: '⭐', big: '200', name: 'Bonus', co: '+200', c: 'linear-gradient(145deg,#ffb938,#e07b12)'},
  b300: {sym: '⭐', big: '300', name: 'Bonus', co: '+300', c: 'linear-gradient(145deg,#ffb938,#e07b12)'},
  b400: {sym: '⭐', big: '400', name: 'Bonus', co: '+400', c: 'linear-gradient(145deg,#ffb938,#e07b12)'},
  b500: {sym: '⭐', big: '500', name: 'Bonus', co: '+500', c: 'linear-gradient(145deg,#ffb938,#e07b12)'},
  b600: {sym: '⭐', big: '600', name: 'Bonus', co: '+600', c: 'linear-gradient(145deg,#ffb938,#e07b12)'},
  x2: {sym: '⚡', big: '×2', name: 'Verdoppelt', co: '×2', c: 'linear-gradient(145deg,#a86bff,#5a2bc4)', txt: 'Tutto geschafft: Die Würfelpunkte werden verdoppelt. Aufhören vorher erlaubt (ohne Verdopplung).'},
  fw: {sym: '🎆', name: 'Feuerwerk', co: '🎆', c: 'linear-gradient(145deg,#ff6b9a,#c2185b)', txt: 'So lange würfeln bis zur Niete – nach jedem Tutto mit allen 6 Würfeln weiter. Alle Punkte zählen.'},
  st: {sym: '🛑', name: 'Stopp', co: 'STOP', c: 'linear-gradient(145deg,#ff5a5f,#a3141a)', txt: 'Pech gehabt! Der Zug ist sofort vorbei.'},
  str: {sym: '🎲', big: '1-6', name: 'Straße', co: '2000', c: 'linear-gradient(145deg,#4fa3ff,#1b56c9)', txt: 'Würfle 1–2–3–4–5–6. Pro Wurf mind. einen neuen Würfel rauslegen. Geschafft = 2000 Punkte.'},
  pm: {sym: '⚖️', big: '1000', name: 'Plus/Minus', co: '±', c: 'linear-gradient(145deg,#3ddc84,#138a4a)', txt: 'Tutto geschafft: +1000 für dich, −1000 für den Führenden. Würfelpunkte zählen nicht.'},
  kl: {sym: '🍀', name: 'Kleeblatt', co: '🍀', c: 'linear-gradient(145deg,#2fd6a0,#0b7a5c)', txt: 'Zweimal hintereinander Tutto = sofortiger Sieg!'},
};
const newDeck = () => {
  const d = [...['b200', 'b300', 'b400', 'b500', 'b600', 'x2', 'fw', 'str', 'pm'].flatMap(k => Array(5).fill(k)), ...Array(10).fill('st'), 'kl'];
  for (let i = d.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [d[i], d[j]] = [d[j], d[i]]; }
  return d;
};
const tset = () => ({...TDEF, ...G('tutto').settings});
const UPPER = [1,2,3,4,5,6].map(n => ({id: 'u' + n, label: ['Einser','Zweier','Dreier','Vierer','Fünfer','Sechser'][n-1], type: 'upper', face: n}));
const LOWER = [
  {id: '3k', label: 'Dreierpasch', type: 'sum', hint: 'alle Augen'},
  {id: '4k', label: 'Viererpasch', type: 'sum', hint: 'alle Augen'},
  {id: 'fh', label: 'Full House', type: 'fixed', key: 'fh'},
  {id: 'ks', label: 'Kl. Straße', type: 'fixed', key: 'ks'},
  {id: 'gs', label: 'Gr. Straße', type: 'fixed', key: 'gs'},
  {id: 'kn', label: 'Kniffel', type: 'fixed', key: 'kn'},
  {id: 'ch', label: 'Chance', type: 'sum', hint: 'alle Augen'},
];
const ALL = [...UPPER, ...LOWER];

function calc(p, set) {
  const up = UPPER.reduce((a, c) => a + (p.s[c.id] || 0), 0);
  const bonus = up >= set.bonusThr ? set.bonusVal : 0;
  const low = LOWER.reduce((a, c) => a + (p.s[c.id] || 0), 0);
  const kb = set.kb ? (p.kb || 0) * set.kbVal : 0;
  return {up, bonus, low, kb, total: up + bonus + low + kb};
}
const isDone = g => g.players.every(p => ALL.every(c => p.s[c.id] !== undefined));

/* ---------- Statistik ---------- */
function allNames() {
  const m = {};
  for (const k in DB.games) for (const g of DB.games[k].history) for (const p of g.players) m[p.name.toLowerCase()] = p.name;
  return m;
}
function stats(k) {
  const m = {}, low = k === 'cabo';
  for (const g of G(k).history) for (const p of g.players) {
    const key = p.name.toLowerCase();
    const s = m[key] || (m[key] = {name: p.name, games: 0, wins: 0, sum: 0, best: 0, kn: 0});
    s.name = p.name; s.games++; s.sum += p.total; s.best = s.games === 1 ? p.total : low ? Math.min(s.best, p.total) : Math.max(s.best, p.total); s.kn += p.kn || 0; s.solo = (s.solo || 0) + (p.solo || 0);
    if (g.winners.includes(key)) s.wins++;
  }
  return Object.values(m).sort((a, b) => b.wins - a.wins || (low ? -1 : 1) * (b.sum / b.games - a.sum / a.games));
}
function statsView(key, extra, o = {}) {
  const st = stats(key), h = G(key).history, f = o.fmt || (v => v);
  if (!st.length) return '<p class="muted" style="margin-top:40px">Noch keine abgeschlossenen Spiele.</p>';
  return (o.list ? '' : st.map((s, i) => `<div class="card"><div class="name">${i === 0 ? '🏆 ' : ''}${esc(s.name)}</div>
    <div class="stat"><div>${s.games}<span>${o.games || 'Spiele'}</span></div><div>${s.wins}<span>Siege</span></div><div>${Math.round(100 * s.wins / s.games)}%<span>Siegquote</span></div>
    ${o.sum ? `<div>${f(s.sum)}<span>Gesamt</span></div>` : ''}<div>${f(Math.round(s.sum / s.games))}<span>${o.avg || 'Ø Punkte'}</span></div><div>${f(s.best)}<span>Bestwert</span></div>${extra ? `<div>${s[extra.key]}<span>${extra.label}</span></div>` : ''}</div></div>`).join('')) +
    `<label class="l">${o.list ? 'Letzte Abende' : 'Letzte Spiele'}</label><div class="card">${h.slice(-10).reverse().map((g, k) => `<div class="hist" ${key === 'schafkopf' && g.log ? `data-act="sHist" data-i="${h.length - 1 - k}" style="cursor:pointer"` : ''}><span style="white-space:nowrap">${new Date(g.date).toLocaleDateString('de-DE')}${key === 'schafkopf' && g.log ? ' <span style="color:var(--acc)">›</span>' : ''}</span><span style="text-align:right">${g.players.slice().sort((a, b) => key === 'cabo' ? a.total - b.total : b.total - a.total).map(p => `${g.winners.includes(p.name.toLowerCase()) ? '🏆' : ''}${esc(p.name)} ${f(p.total)}`).join(' · ')}</span></div>`).join('')}</div>
    <button class="btn bad" data-act="resetStats" data-game="${key}" style="margin-top:8px">Statistik zurücksetzen</button>`;
}

/* ---------- Navigation ---------- */
const BACK = {kmenu: 'home', ksetup: 'kmenu', kgame: 'kmenu', kstats: 'kmenu', ksettings: 'kmenu', tmenu: 'home', tsetup: 'tmenu', tgame: 'tmenu', tstats: 'tmenu', tsettings: 'tmenu', cmenu: 'home', csetup: 'cmenu', cgame: 'cmenu', cstats: 'cmenu', csettings: 'cmenu', smenu: 'home', ssetup: 'smenu', sgame: 'smenu', sstats: 'smenu', ssettings: 'smenu', schart: 'sgame', spay: 'smenu', sevening: 'sstats'};
const TITLE = {home: 'Spielblock', kmenu: 'Kniffel', ksetup: 'Neues Spiel', kgame: 'Kniffel', kstats: 'Statistik', ksettings: 'Einstellungen', tmenu: 'Tutto', tsetup: 'Neues Spiel', tgame: 'Tutto', tstats: 'Statistik', tsettings: 'Einstellungen', cmenu: 'Cabo', csetup: 'Neues Spiel', cgame: 'Cabo', cstats: 'Statistik', csettings: 'Einstellungen', smenu: 'Schafkopf', ssetup: 'Neuer Abend', sgame: 'Schafkopf', sstats: 'Statistik', ssettings: 'Einstellungen', schart: 'Verlauf', spay: 'Abrechnung', sevening: 'Spieleabend'};
let view = 'home', setup = {game: 'kniffel', n: 2, names: ['', '']};
function go(v) { view = v; render(); $('#app').scrollTop = 0; }
$('#back').onclick = () => { const b = (view === 'schart' ? chartSrc?.chartBack : view === 'spay' ? chartSrc?.payBack : null) || BACK[view]; if (b) go(b); };

function render() {
  $('#title').textContent = TITLE[view];
  $('#back').style.visibility = BACK[view] ? 'visible' : 'hidden';
  $('#app').innerHTML = VIEWS[view]();
  if (view === 'schart') drawChart();
}

const VIEWS = {
  home() {
    return `<p class="muted" style="margin-top:0">Welches Spiel schreiben wir auf?</p>
      <button class="big" data-act="go" data-v="kmenu"><span class="ic">🎲</span><span>Kniffel<small>Würfelblock mit 13 Feldern</small></span></button>
      <button class="big" data-act="go" data-v="tmenu"><span class="ic">🎯</span><span>Tutto<small>Würfeln bis 6.000 Punkte</small></span></button>
      <button class="big" data-act="go" data-v="cmenu"><span class="ic">🃏</span><span>Cabo<small>Unter 100 Punkten bleiben</small></span></button>
      <button class="big" data-act="go" data-v="smenu"><span class="ic">🐑</span><span>Schafkopf<small>Spieleabend abrechnen</small></span></button>`;
  },
  kmenu() {
    const cur = G('kniffel').current;
    return `<button class="big" data-act="newGame" data-game="kniffel"><span class="ic">✨</span><span>Neues Spiel</span></button>

  spay() {

    const bal = c.names.map((n, i) => ({n, v: c.log.reduce((a, d) => a + d[i], 0)})), pay = [];
    const deb = bal.filter(b => b.v < 0).map(b => ({...b, v: -b.v})).sort((a, b) => b.v - a.v), cre = bal.filter(b => b.v > 0).map(b => ({...b})).sort((a, b) => b.v - a.v);
    for (const d of deb) for (const k of cre) { const m = Math.min(d.v, k.v); if (m > 0) { pay.push([d.n, k.n, m]); d.v -= m; k.v -= m; } }
    return `<p class="muted" style="margin-top:0">So viel muss gezahlt werden, damit alles aufgeht:</p>

VIEWS.tsetup = VIEWS.csetup = VIEWS.ssetup = VIEWS.ksetup;

/* ---------- Aktionen ---------- */
const ACT = {
  go: d => go(d.v),
  newGame(d) { const game = d.game || 'kniffel'; const n = game === 'schafkopf' ? 4 : 2; setup = {game, n, names: Array(n).fill('')}; go(game[0] + 'setup'); },
  cnt(d) { const n = +d.n; setup.names = Array.from({length: n}, (_, i) => setup.names[i] || ''); setup.n = n; render(); },
  chip(d) {
    if (setup.names.some(x => x.trim().toLowerCase() === d.name.toLowerCase())) return;
    let i = setup.names.findIndex(x => !x.trim());
    if (i < 0) return;
    setup.names[i] = d.name; render();
  },
  start() {
    const known = allNames(), names = setup.names.map((n, i) => n.trim() || 'Spieler ' + (i + 1)).map(n => known[n.toLowerCase()] || n);
    if (new Set(names.map(n => n.toLowerCase())).size < names.length) return alert('Jeder Name darf nur einmal vorkommen.');
    const key = setup.game, cur = G(key).current;
    if (cur && !confirm('Es läuft noch ein Spiel. Es wird verworfen – trotzdem neu starten?')) return;
    if (key === 'kniffel') {
      G(key).current = {id: Date.now(), settings: kset(), players: names.map(name => ({name, s: {}, kb: 0}))};
      save(); go('kgame');
    } else if (key === 'schafkopf') {
      G(key).current = {id: Date.now(), settings: sset(), players: names.map(name => ({name, total: 0, solo: 0})), log: []};
      save(); go('sgame');
    } else if (key === 'cabo') {
      G(key).current = {id: Date.now(), settings: cset(), players: names.map(name => ({name, total: 0})), log: []};
      save(); go('cgame');
    } else {
      const digital = tset().deck === 'digital';
      G(key).current = {id: Date.now(), settings: tset(), players: names.map(name => ({name, total: 0, turns: []})), turn: 0, targetReached: false, digital, deck: digital ? newDeck() : [], card: null};
      save(); go('tgame');
    }
  },
  cell(d) { openPicker(+d.p, d.c); },
  kb(d) {
    const g = G('kniffel').current, p = g.players[+d.p];
    $('#modalBox').innerHTML = `<h3>${esc(p.name)}: Kniffel-Bonus</h3><p>Wie viele weitere Kniffel (+${g.settings.kbVal} je)?</p>
      <div class="grid" style="grid-template-columns:repeat(5,1fr)">${[0,1,2,3,4].map(v => `<button data-act="setKb" data-p="${d.p}" data-v="${v}">${v}</button>`).join('')}</div>`;
    $('#modal').classList.add('on');
  },
  setKb(d) { G('kniffel').current.players[+d.p].kb = +d.v; save(); closeModal(); render(); },
  set(d) {
    const g = G('kniffel').current, p = g.players[+d.p];
    if (d.v === 'x') delete p.s[d.c]; else p.s[d.c] = +d.v;
    save(); closeModal(); render();
    if (isDone(g)) finish();
  },
  addPts(d) { openTuttoEntry(+d.p); },
  submitPts(d) {
    const g = G('tutto').current, pi = +d.p, p = g.players[pi];

let cr = {caller: -1, zero: {}}, sk = null, chartSrc = null;
function drawChart() {
  const c = chartSrc, box = $('#chartSvg'); if (!box) return;
  const cum = c.names.map((_, i) => { let t = 0; return [0, ...c.log.map(d => t += d[i])]; });
  const W = box.clientWidth, H = 260, L = 46, Rt = 78, T = 10, B = 26, n = c.log.length;
  const all = cum.flat(), lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const step = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000].find(v => (hi - lo) / v <= 5) || 10000;
  const y0 = Math.floor(lo / step) * step, y1 = Math.max(Math.ceil(hi / step) * step, y0 + step);
  const x = j => L + (W - L - Rt) * (n ? j / n : 0), y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  let grid = '';
  for (let v = y0; v <= y1; v += step) grid += `<line x1="${L}" x2="${W - Rt}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--dim)' : 'var(--line)'}" stroke-width="${v === 0 ? 1.5 : 1}" ${v === 0 ? '' : 'stroke-dasharray="2 4"'}/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${(v / 100).toFixed(step < 100 ? 1 : 0).replace('.', ',')}€</text>`;
  const xs = Math.max(1, Math.ceil(n / 8));
  for (let j = 0; j <= n; j += xs) grid += `<text class="ax" x="${x(j)}" y="${H - 6}" text-anchor="middle">${j}</text>`;
  const lines = cum.map((s, i) => `<path d="${s.map((v, j) => (j ? 'L' : 'M') + x(j).toFixed(1) + ' ' + y(v).toFixed(1)).join('')}" fill="none" stroke="${SERIES[i]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const ends = cum.map((s, i) => ({i, y: y(s[n])})).sort((a, b) => a.y - b.y);
  ends.forEach((e, k) => { e.ly = k ? Math.max(e.y, ends[k - 1].ly + 15) : e.y; });
  const over = ends.length ? ends.at(-1).ly - (H - B) : 0;
  if (over > 0) ends.forEach(e => e.ly -= over);
  const labels = ends.map(e => `<circle cx="${x(n)}" cy="${e.y}" r="4.5" fill="${SERIES[e.i]}" stroke="var(--card)" stroke-width="2"/><text class="lbl" x="${x(n) + 9}" y="${e.ly + 4}">${esc(c.names[e.i].slice(0, 8))}</text>`).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Verlauf der Salden über ${n} Spiele">${grid}${lines}<line id="cross" y1="${T}" y2="${H - B}" stroke="var(--dim)" stroke-width="1" style="display:none"/>${labels}<g id="dots"></g><rect x="${L}" y="0" width="${W - L - Rt}" height="${H}" fill="transparent" id="hit"/></svg>`;
  const tip = $('#tip'), cross = $('#cross'), dots = $('#dots'), hit = $('#hit');
  const show = ev => {
    const r = hit.getBoundingClientRect(), j = Math.max(0, Math.min(n, Math.round((ev.clientX - r.left) / r.width * n)));
    cross.setAttribute('x1', x(j)); cross.setAttribute('x2', x(j)); cross.style.display = '';
    dots.innerHTML = cum.map((s, i) => `<circle cx="${x(j)}" cy="${y(s[j])}" r="4.5" fill="${SERIES[i]}" stroke="var(--card)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<b>${j ? 'Nach Spiel ' + j : 'Start'}</b>` + cum.map((s, i) => ({i, v: s[j]})).sort((a, b) => b.v - a.v).map(o => `<div><span><span class="sw" style="background:${SERIES[o.i]}"></span>${esc(c.names[o.i])}</span><span>${eur(o.v, true)}</span></div>`).join('');
    tip.style.display = 'block';
    const px = x(j) + 8, tw = tip.offsetWidth;
    tip.style.left = (px + tw + 8 > W ? x(j) - tw - 4 : px + 8) + 'px'; tip.style.top = '44px';
  };
  const hide = () => { tip.style.display = 'none'; cross.style.display = 'none'; dots.innerHTML = ''; };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', hide);
}
function skLine(r, names, no) {
  const nm = i => esc(names[i]);
  return `<div class="hist"><span>${no ? no + '. ' : ''}${SKT[r.type]} · ${r.type === 'ramsch' ? (r.dm ? '🚶 Durchmarsch ' : '💀 ') + nm(r.pl[0]) + (r.jf && !r.dm ? ' · 👰×' + r.jf : '') : r.pl.map(nm).join(' + ') + (r.won ? ' ✅' : ' ❌')}${r.mult > 1 ? ' · ×' + r.mult : ''}</span><span>${eur(Math.abs(r.d[r.pl[0]]))}</span></div>`;
}
function skCalc(g) {
  const s = g.settings, need = sk.type === 'sau' ? 2 : 1;
  if (sk.pl.length !== need) return null;
  const mult = 2 ** (sk.kl + sk.ko + sk.re + (sk.type === 'ramsch' && !sk.dm ? sk.jf : 0));
  if (sk.type === 'ramsch') { const v = (sk.dm ? s.durch : s.ramsch) * mult, sg = sk.dm ? 1 : -1; return {mult, v, d: g.players.map((_, i) => i === sk.pl[0] ? 3 * sg * v : -sg * v)}; }
  const thr = {sau: s.lfSau, solo: s.lfSolo, wenz: s.lfWenz}[sk.type], lf = sk.lf >= thr ? sk.lf : 0;
  const v = ((sk.type === 'sau' ? s.sau : s.solo) + s.extra * (sk.sn + sk.sw + lf)) * mult, sg = sk.won ? 1 : -1;
  const d = g.players.map((_, i) => sk.type === 'sau' ? (sk.pl.includes(i) ? sg * v : -sg * v) : (i === sk.pl[0] ? 3 * sg * v : -sg * v));
  return {mult, v, d};
}

    <label class="l">Geklopft (je ×2)</label>${seg('kl', [0, 1, 2, 3, 4].map(n => [n, n ? n + '× 👊' : 'nein']))}
    ${s.kontra ? `<label class="l">Kontra / Re (je ×2)</label><div class="seg">${tog('ko', '🗣️ Kontra')}${tog('re', '🔁 Re')}</div>` : ''}
    <div class="card" style="margin:14px 0 10px;text-align:center">${r ? g.players.map((p, i) => `<div class="hist"><span>${esc(p.name)}</span><b class="${r.d[i] > 0 ? 'plus' : 'minus'}">${eur(r.d[i], true)}</b></div>`).join('') : '<span class="muted">Bitte Spieler auswählen</span>'}</div>

function applyPM(g, pi) {
  const p = g.players[pi], max = Math.max(...g.players.map(x => x.total));
  if (p.total !== max) g.players.forEach(x => { if (x.total === max) x.total = Math.max(0, x.total - 1000); });
  p.total += 1000;
  if (p.total >= g.settings.target) g.targetReached = true;
}
function nextT(g, pi, advance) {
  if (g.players[pi].total >= g.settings.target) g.targetReached = true;
  let done = false;
  if (advance && pi === g.turn) { g.turn = (g.turn + 1) % g.players.length; done = g.targetReached && g.turn === 0; g.card = null; }
  save(); closeModal();
  if (done) finishTutto(); else render();
}

}

    body = `<div class="grid" style="grid-template-columns:repeat(6,1fr)">${b(0, '0', 'z')}${vals.map(v => b(v, v)).join('')}</div>`;
  }
  $('#modalBox').innerHTML = `<h3>${esc(p.name)}: ${c.label}</h3><p>${c.type === 'upper' ? 'Wie viele Würfel mit ' + c.face + '?' : c.type === 'fixed' ? 'Geschafft oder gestrichen?' : 'Summe aller Augen (0 = streichen)'}</p>${body}
    ${cur !== undefined ? `<button class="btn" style="margin-top:12px" data-act="set" data-p="${pi}" data-c="${cid}" data-v="x">Feld leeren</button>` : ''}`;
  $('#modal').classList.add('on');
}

function openTuttoEntry(pi) {
  const g = G('tutto').current, p = g.players[pi], active = pi === g.turn;
  const last = p.turns[p.turns.length - 1];
  $('#modalBox').innerHTML = `<h3>${esc(p.name)}: Punkte eintragen</h3><p>${active ? 'Punktzahl dieses Wurfs (leer lassen = Niete)' : 'Korrektur (z. B. Plus/Minus-Karte) – auch negative Werte möglich'}</p>
    <input class="inp" id="ptsInput" type="number" inputmode="numeric" placeholder="Punkte" style="text-align:center;font-size:22px">
    <button class="btn acc" style="margin-top:10px" data-act="submitPts" data-p="${pi}" data-v="input">Eintragen</button>
    ${last !== undefined ? `<button class="btn" style="margin-top:12px" data-act="undoT" data-p="${pi}">Letzten Eintrag rückgängig (${last >= 0 ? '+' : ''}${last})</button>` : ''}`;
  $('#modal').classList.add('on');
  setTimeout(() => $('#ptsInput')?.focus(), 50);
}

/* ---------- Spielende ---------- */
function finish() {
  const st = G('kniffel'), g = st.current, set = g.settings;
  const res = g.players.map(p => ({name: p.name, ...calc(p, set), kn: p.s.kn > 0 ? 1 + (p.kb || 0) : (p.kb || 0)}));
  const max = Math.max(...res.map(r => r.total));
  const winners = res.filter(r => r.total === max).map(r => r.name);
  st.history.push({id: g.id, date: Date.now(), winners: winners.map(w => w.toLowerCase()), players: res.map(r => ({name: r.name, total: r.total, kn: r.kn}))});
  st.current = null; save();
  const medal = ['🥇', '🥈', '🥉'];
  const sorted = res.slice().sort((a, b) => b.total - a.total);
  $('#winBox').innerHTML = `<div class="trophy">🏆</div><p style="margin:0;color:var(--dim)">${winners.length > 1 ? 'Unentschieden – Gewinner' : 'Gewinner'}</p>
    <h2>${winners.map(esc).join(' &amp; ')}</h2><p style="margin:0 0 12px;font-size:20px">${max} Punkte</p>
    <div style="margin-bottom:16px">${sorted.map((r, i) => `<div class="rank"><span>${medal[i] || (i + 1) + '.'} ${esc(r.name)}</span><b>${r.total}</b></div>`).join('')}</div>
    <button class="btn ok" data-act="winNew">Neues Spiel</button><button class="btn" data-act="winMenu">Zum Menü</button>`;
  $('#win').classList.add('on');
  fanfare(); confetti();
}

function finishTutto(forceIdx) {
  const st = G('tutto'), g = st.current;
  const winners = forceIdx !== undefined ? [g.players[forceIdx].name] : (() => {
    const max = Math.max(...g.players.map(p => p.total));
    return g.players.filter(p => p.total === max).map(p => p.name);
  })();
  st.history.push({id: g.id, date: Date.now(), winners: winners.map(w => w.toLowerCase()), players: g.players.map(p => ({name: p.name, total: p.total}))});
  st.current = null; save();
  const medal = ['🥇', '🥈', '🥉'];
  const sorted = g.players.slice().sort((a, b) => b.total - a.total);
  const headline = forceIdx !== undefined ? g.players[forceIdx].total : Math.max(...g.players.map(p => p.total));
  $('#winBox').innerHTML = `<div class="trophy">🏆</div><p style="margin:0;color:var(--dim)">${forceIdx !== undefined ? '🍀 Kleeblatt-Sieg' : winners.length > 1 ? 'Unentschieden – Gewinner' : 'Gewinner'}</p>
    <h2>${winners.map(esc).join(' &amp; ')}</h2><p style="margin:0 0 12px;font-size:20px">${headline} Punkte</p>
    <div style="margin-bottom:16px">${sorted.map((p, i) => `<div class="rank"><span>${medal[i] || (i + 1) + '.'} ${esc(p.name)}</span><b>${p.total}</b></div>`).join('')}</div>
    <button class="btn ok" data-act="winNewT">Neues Spiel</button><button class="btn" data-act="winMenuT">Zum Menü</button>`;
  $('#win').classList.add('on');
  fanfare(); confetti();
}

function finishCabo() {
  const st = G('cabo'), g = st.current, min = Math.min(...g.players.map(p => p.total));
  const winners = g.players.filter(p => p.total === min).map(p => p.name);
  const losers = g.players.filter(p => p.total > g.settings.limit).map(p => p.name);
  st.history.push({id: g.id, date: Date.now(), winners: winners.map(w => w.toLowerCase()), players: g.players.map(p => ({name: p.name, total: p.total}))});
  st.current = null; save();
  const medal = ['🥇', '🥈', '🥉'];
  const sorted = g.players.slice().sort((a, b) => a.total - b.total);
  $('#winBox').innerHTML = `<div class="trophy">🏆</div><p style="margin:0;color:var(--dim)">${winners.length > 1 ? 'Unentschieden – Gewinner' : 'Gewinner'}</p>
    <h2>${winners.map(esc).join(' &amp; ')}</h2><p style="margin:0 0 4px;font-size:20px">${min} Punkte</p>
    <p style="margin:0 0 12px;color:var(--dim)">💀 ${losers.map(esc).join(' &amp; ')} über ${g.settings.limit}</p>
    <div style="margin-bottom:16px">${sorted.map((p, i) => `<div class="rank"><span>${medal[i] || (i + 1) + '.'} ${esc(p.name)}</span><b>${p.total}</b></div>`).join('')}</div>
    <button class="btn ok" data-act="winNewC">Neues Spiel</button><button class="btn" data-act="winMenuC">Zum Menü</button>`;
  $('#win').classList.add('on');
  fanfare(); confetti();
}

function finishSchafkopf() {
  const st = G('schafkopf'), g = st.current, max = Math.max(...g.players.map(p => p.total));
  const winners = g.players.filter(p => p.total === max).map(p => p.name);
  st.history.push({id: g.id, date: Date.now(), winners: winners.map(w => w.toLowerCase()), players: g.players.map(p => ({name: p.name, total: p.total, solo: p.solo})), log: g.log.map(r => r.d), games: g.log});
  st.current = null; save();
  const medal = ['🥇', '🥈', '🥉'];
  const sorted = g.players.slice().sort((a, b) => b.total - a.total);
  $('#winBox').innerHTML = `<div class="trophy">🐑</div><p style="margin:0;color:var(--dim)">${g.log.length} Spiele · ${winners.length > 1 ? 'Gewinner' : 'Gewinner des Abends'}</p>
    <h2>${winners.map(esc).join(' &amp; ')}</h2><p style="margin:0 0 12px;font-size:20px">${eur(max, true)}</p>
    <div style="margin-bottom:16px">${sorted.map((p, i) => `<div class="rank"><span>${medal[i] || (i + 1) + '.'} ${esc(p.name)}</span><b class="${p.total > 0 ? 'plus' : p.total < 0 ? 'minus' : ''}">${eur(p.total, true)}</b></div>`).join('')}</div>
    <button class="btn ok" data-act="winPayS">💸 Weiter: Wer zahlt wem?</button>`;
  $('#win').classList.add('on');
  fanfare(); confetti();
}

/* ---------- Ton ---------- */
let ac;
function unlock() {
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
}
document.addEventListener('touchstart', unlock, {passive: true});
document.addEventListener('click', unlock);
function fanfare() {
  if (!DB.sound || !ac) return;
  const seq = [[523.25, 0, .15], [659.25, .15, .15], [783.99, .3, .15], [1046.5, .45, .35], [783.99, .85, .12], [1046.5, .97, .6], [1318.5, 1.3, .9]];
  const t0 = ac.currentTime + .05;
  for (const [f, s, d] of seq) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), gn = ac.createGain();
    o.type = 'triangle'; o2.type = 'square'; o.frequency.value = f; o2.frequency.value = f / 2;
    gn.gain.setValueAtTime(0, t0 + s); gn.gain.linearRampToValueAtTime(.22, t0 + s + .02); gn.gain.exponentialRampToValueAtTime(.001, t0 + s + d + .25);
    o.connect(gn); o2.connect(gn); gn.connect(ac.destination);
    o.start(t0 + s); o2.start(t0 + s); o.stop(t0 + s + d + .3); o2.stop(t0 + s + d + .3);
  }
}

/* ---------- Konfetti ---------- */
function confetti() {
  const cv = $('#conf'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#ff5a5f', '#ffc83d', '#30c86a', '#5b8cff', '#c77dff', '#fff'];
  const P = Array.from({length: 170}, () => ({x: Math.random() * innerWidth, y: -Math.random() * innerHeight, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 2 + Math.random() * 3.5, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[Math.random() * cols.length | 0]}));
  const end = performance.now() + 6000;
  (function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) {
      p.x += p.vx + Math.sin(p.y / 40); p.y += p.vy; p.r += p.vr;
      if (p.y > innerHeight + 20 && now < end - 1500) { p.y = -20; p.x = Math.random() * innerWidth; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (now < end) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(performance.now());
}

/* ---------- Start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
